<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESC ACS - Unit Tests</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      h1 {
        color: #0f4c5c;
      }
      .stats {
        display: flex;
        gap: 20px;
        margin: 20px 0;
      }
      .stat-box {
        padding: 20px 30px;
        border-radius: 12px;
        font-size: 24px;
        font-weight: bold;
      }
      .passed {
        background: #d4edda;
        color: #155724;
      }
      .failed {
        background: #f8d7da;
        color: #721c24;
      }
      .results {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      .result-item {
        padding: 8px 12px;
        margin: 4px 0;
        border-radius: 6px;
        font-family: monospace;
        font-size: 13px;
      }
      .result-item.PASS {
        background: #d4edda;
        color: #155724;
      }
      .result-item.FAIL {
        background: #f8d7da;
        color: #721c24;
        font-weight: bold;
      }
      button {
        background: linear-gradient(120deg, #0f4c5c, #0b7285);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin: 10px 0;
      }
      button:hover {
        opacity: 0.9;
      }
      .section {
        margin: 20px 0;
        padding: 15px;
        background: #e8e8e8;
        border-radius: 8px;
      }
      .section h3 {
        margin: 0 0 10px;
        color: #0f4c5c;
      }
    </style>
  </head>
  <body>
    <h1>ESC ACS Living Meta-Analysis - Unit Tests</h1>

    <div style="margin-bottom: 20px;">
      <button onclick="executeTests()">Run Unit Tests</button>
      <a href="r-validation-runner.html" style="display: inline-block; background: linear-gradient(120deg, #9b4dca, #6b4ce3); color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; margin-left: 10px; font-size: 16px;">🔬 R Package Validation</a>
    </div>

    <div class="stats" id="stats" style="display:none">
      <div class="stat-box passed">
        <span id="passedCount">0</span> Passed
      </div>
      <div class="stat-box failed">
        <span id="failedCount">0</span> Failed
      </div>
    </div>

    <div class="results" id="results"></div>

    <script type="module">
      import { runAllTests } from "./tests.js";

      window.executeTests = function() {
        const output = runAllTests();

        document.getElementById("stats").style.display = "flex";
        document.getElementById("passedCount").textContent = output.passed;
        document.getElementById("failedCount").textContent = output.failed;

        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "";

        let currentSection = "";
        output.results.forEach(r => {
          // Extract section name from message
          const sectionMatch = r.message.match(/^([A-Za-z]+)/);
          const section = sectionMatch ? sectionMatch[1] : "Other";

          const item = document.createElement("div");
          item.className = `result-item ${r.status}`;
          item.textContent = `[${r.status}] ${r.message}`;
          resultsDiv.appendChild(item);
        });
      };
    </script>
  </body>
</html>
